# render.yaml — Render Blueprint for EasyCart
# No secrets are stored here. Configure them via the Render Dashboard.
services:
  - type: web
    name: easycart
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false            # Set manually in Render Dashboard
      - key: SECRET_KEY
        generateValue: true    # Render auto-generates a strong random secret
      - key: PYTHON_VERSION
        value: "3.12.3"

